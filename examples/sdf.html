<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShaderIntel — SDF scene (cone-marched)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="info"><b>Signed distance fields</b> — the whole scene is one WGSL <code>map()</code> built from the shader library
    (smooth unions, twists, domain repetition, noise displacement). Cone-marched: one conservative cone per 4×4 pixels skips shared empty space.</div>
</div>
<script src="common.js"></script>
<script type="module">
import * as SI from '../src/index.js';

const gpu = await SI.init();
const view = gpu.view('#c', { camera: { target: [0, 0.8, 0], distance: 6.5, pitch: 0.25, yaw: 0.6 }, hud: true, background: [0.05, 0.06, 0.08, 1] });

const scene = gpu.sdf({
  imports: ['noise'],
  uniforms: { blend: 'f32', twist: 'f32', bump: 'f32' },
  values: { blend: 0.35, twist: 1.2, bump: 0.03 },
  code: /* wgsl */`
    fn map(p: vec3f) -> vec2f {
      let t = u.time;
      // ground
      var d = vec2f(p.y + 0.0, 0.0);
      // three blobs melting together
      let a = vec3f(sin(t * 0.7) * 0.9, 1.0 + 0.3 * sin(t * 1.3), cos(t * 0.5) * 0.4);
      let b = vec3f(-0.8, 0.9 + 0.25 * cos(t), 0.3);
      let c = vec3f(0.3, 1.6 + 0.2 * sin(t * 0.9), -0.6);
      var blob = smin(sdSphere(p - a, 0.55), sdSphere(p - b, 0.5), u.blend);
      blob = smin(blob, sdSphere(p - c, 0.4), u.blend);
      // displacement adds slope (|∇| up to ~1 + 11·bump), so scale to keep the field 1-Lipschitz
      blob += u.bump * simplex3(p * 4.0 + vec3f(0.0, t * 0.5, 0.0));
      d = opU(d, vec2f(blob / (1.0 + 11.0 * u.bump), 1.0));
      // twisted pillar
      let q = opTwist(p - vec3f(2.4, 1.2, -1.0), u.twist);
      d = opU(d, vec2f(sdRoundBox(q, vec3f(0.35, 1.2, 0.35), 0.06), 2.0));
      // torus knot-ish ring
      d = opU(d, vec2f(sdTorus((p - vec3f(-2.3, 0.6, -0.5)).xzy, vec2f(0.55, 0.16)), 3.0));
      // a row of repeated pebbles
      let r = opRepeatLimited(p - vec3f(0.0, 0.18, 2.4), 0.55, vec3f(4.0, 0.0, 0.0));
      d = opU(d, vec2f(sdEllipsoid(r, vec3f(0.22, 0.16, 0.2)), 4.0));
      // metal sphere
      d = opU(d, vec2f(sdSphere(p - vec3f(1.4, 0.45, 1.4), 0.45), 5.0));
      return d;
    }`,
});
view.add(scene);
SI.panel('SDF scene', [
  { label: 'blend', min: 0, max: 1, step: 0.01, value: 0.35, onInput: (v) => scene.set({ blend: v }) },
  { label: 'twist', min: -3, max: 3, step: 0.01, value: 1.2, onInput: (v) => scene.set({ twist: v }) },
  { label: 'bumps', min: 0, max: 0.1, step: 0.005, value: 0.03, onInput: (v) => scene.set({ bump: v }) },
  { label: 'soft shadows', checked: true, onChange: (v) => scene.set({ shadows: v ? 1 : 0 }) },
  { label: 'ambient occl.', checked: true, onChange: (v) => scene.set({ ao: v ? 1 : 0 }) },
]);
Object.assign(window, { gpu, view, scene });
view.run();
</script>
</body>
</html>
